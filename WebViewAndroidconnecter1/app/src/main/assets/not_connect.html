<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Not connect</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          background: #0B1220;
          color: #fff;
          font-family: Arial, Helvetica, sans-serif;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 24px;
        }
        .icone { width: 110px; height: 110px; margin-bottom: 24px; animation: flotte 2.4s ease-in-out infinite; }
        @keyframes flotte { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        h1 { font-size: 24px; margin-bottom: 10px; }
        h1 span { color: #FFC400; }
        p { color: #9AA7BF; font-size: 15px; line-height: 1.5; max-width: 320px; }
        .chargement { display: flex; align-items: center; gap: 10px; margin-top: 28px; color: #9AA7BF; font-size: 14px; }
        .spinner {
          width: 20px; height: 20px;
          border: 3px solid #16233D;
          border-top-color: #FFC400;
          border-radius: 50%;
          animation: tourne 0.9s linear infinite;
        }
        @keyframes tourne { to { transform: rotate(360deg); } }
        button {
          margin-top: 28px;
          background: #1E6BFF;
          color: #fff;
          border: none;
          border-radius: 24px;
          padding: 13px 34px;
          font-size: 16px;
          font-weight: bold;
        }
        button:active { opacity: 0.8; }
        .ligne { position: fixed; bottom: 0; left: 0; right: 0; height: 4px; display: flex; }
        .ligne div { flex: 1; }
    </style>
</head>
<body>
<svg class="icone" viewBox="0 0 24 24" fill="none" stroke="#FFC400" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 8.8a15 15 0 0 1 4.2-2.6"/>
    <path d="M10 5.2a15 15 0 0 1 12 3.6"/>
    <path d="M5 12.5a10 10 0 0 1 3.5-2.2"/>
    <path d="M13.5 10a10 10 0 0 1 5.5 2.5"/>
    <path d="M8.5 16.4a5 5 0 0 1 7 0"/>
    <circle cx="12" cy="20" r="0.8" fill="#FFC400"/>
    <line x1="2" y1="2" x2="22" y2="22" stroke="#E5252A"/>
</svg>

<h1>Pas de <span>connexion</span></h1>
<p>Impossible de joindre le serveur YeTuS. Vérifie ton Wi-Fi ou ta connexion.</p>

<div class="chargement">
    <div class="spinner"></div>
    <span>Reconnexion automatique en cours...</span>
</div>

<button onclick="window.location.href='http://192.168.2.225'">Réessayer</button>

<div class="ligne">
    <div style="background:#1E6BFF"></div>
    <div style="background:#FFC400"></div>
    <div style="background:#E5252A"></div>
</div>
</body>
</html>
